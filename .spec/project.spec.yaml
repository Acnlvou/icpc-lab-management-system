project:
  name: "ICPC实验室管理系统"
  code: "icpc-lab-ms"
  team: "Kcat"
  course: "UML与软件工程建模"
  version: "0.5.0-milestone"
  methodology:
    process: "Scrum"
    ai_paradigm: "SDD (Spec-Driven Development)"
  tech_stack:
    frontend:
      framework: "Vue 3 (Composition API)"
      build_tool: "Vite"
      router: "Vue Router 4"
      visualization: "Native SVG Charts & Radar"
    backend:
      framework: "FastAPI"
      orm: "SQLAlchemy 2.0"
      validation: "Pydantic v2"
      database: "SQLite 3"
      testing: "pytest + httpx"

